<article class="phrase-card"><div class="card-meta"><span>{{ p['language'] }}</span><span>{{ p['region'] }}</span></div><a class="card-main" href="{{ url_for('phrase',phrase_id=p['id']) }}"><h3>{{ p['phrase'] }}</h3>{% if p['transliteration'] %}<p class="transliteration">{{ p['transliteration'] }}</p>{% endif %}<p>{{ p['contextual_meaning'] }}</p></a><div class="card-foot"><span>{{ p['verification_status'] }}</span><a href="{{ url_for('phrase',phrase_id=p['id']) }}" aria-label="Open phrase">↗</a></div></article>
